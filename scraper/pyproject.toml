[project]
name = "nailsprofi-scraper"
version = "0.1.0"
description = "Structured public-data scraper for nailsprofi.ru"
requires-python = ">=3.10"
dependencies = [
  "scrapling[fetchers]>=0.4.9,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
nailsprofi-scrape = "nailsprofi_scraper.cli:main"
nailsprofi-blog-import = "nailsprofi_scraper.blog_import:main"
nailsprofi-wordpress-export = "nailsprofi_scraper.wordpress_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nailsprofi_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
